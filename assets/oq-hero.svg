<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Eng. Osama Ali — OQ Developer</title>
  <desc id="desc">A futuristic graphite developer banner with a neon OQ monogram, circuit traces, and a software engineering identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D13"/>
      <stop offset=".55" stop-color="#101923"/>
      <stop offset="1" stop-color="#07131A"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39D98A"/>
      <stop offset=".52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#4B8DFF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8BA4B8" stroke-opacity=".08" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#22D3EE" fill-opacity=".2"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="390" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="388" rx="25" fill="none" stroke="#263847" stroke-width="2"/>
  <ellipse cx="950" cy="165" rx="270" ry="190" fill="#22D3EE" opacity=".06" filter="url(#softGlow)"/>
  <ellipse cx="170" cy="320" rx="240" ry="120" fill="#39D98A" opacity=".05" filter="url(#softGlow)"/>
  <g fill="none" stroke="#2B4657" stroke-width="2" opacity=".8">
    <path d="M760 0V42H850V90H970"/>
    <path d="M1200 94H1110V145H1030"/>
    <path d="M1200 286H1090V248H1000V220"/>
    <path d="M760 390V335H840V300H910"/>
    <path d="M0 82H75V120H150"/>
    <path d="M0 300H110V260H178"/>
  </g>
  <g fill="#22D3EE"><circle cx="970" cy="90" r="4"/><circle cx="1030" cy="145" r="4"/><circle cx="1000" cy="220" r="4"/><circle cx="910" cy="300" r="4"/></g>
  <g fill="#39D98A"><circle cx="150" cy="120" r="4"/><circle cx="178" cy="260" r="4"/></g>
  <g transform="translate(850 80)">
    <circle cx="145" cy="115" r="92" fill="none" stroke="#39D98A" stroke-opacity=".12" stroke-width="24" filter="url(#softGlow)"/>
    <circle cx="145" cy="115" r="74" fill="none" stroke="url(#neon)" stroke-width="12"/>
    <path d="M190 166 246 222" fill="none" stroke="#22D3EE" stroke-width="13" stroke-linecap="round"/>
    <path d="M180 70H245V160H180" fill="none" stroke="#39D98A" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="245" cy="70" r="5" fill="#22D3EE"/><circle cx="180" cy="160" r="5" fill="#39D98A"/>
    <circle cx="145" cy="115" r="4" fill="#E6EDF3"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="78" y="92" fill="#39D98A" font-size="15" font-weight="700" letter-spacing="5">OQ DEVELOPER  /  DIGITAL FRONTIER</text>
    <text x="74" y="172" fill="#F0F6FC" font-size="62" font-weight="800" letter-spacing="1">OSAMA ALI</text>
    <text x="78" y="216" fill="#22D3EE" font-size="22" font-weight="700" letter-spacing="4">SOFTWARE DEVELOPMENT</text>
    <text x="78" y="260" fill="#A9BAC8" font-size="17" letter-spacing="1.2">CYBERSECURITY  •  OPEN SOURCE  •  CONTINUOUS LEARNING</text>
    <rect x="78" y="296" width="450" height="3" rx="2" fill="#1D3441"/>
    <rect x="78" y="296" width="218" height="3" rx="2" fill="url(#neon)" filter="url(#smallGlow)"/>
    <text x="78" y="334" fill="#7F96A8" font-size="13" letter-spacing="2.8">DESIGN THE FUTURE. BUILD THE NEXT GENERATION.</text>
  </g>
  <g font-family="Consolas, monospace" font-size="10" fill="#6E899B" letter-spacing="1.5">
    <text x="1080" y="34">OQ / 001</text><text x="1080" y="360">SYSTEM ONLINE</text><text x="30" y="360">YEMEN / IT</text>
  </g>
  <path d="M28 28H150M28 28V58M1172 28H1050M1172 28V58M28 362H150M28 362V332M1172 362H1050M1172 362V332"
        fill="none" stroke="#39D98A" stroke-opacity=".38" stroke-width="2"/>
</svg>